name: Build EaglerXR HTML

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-html:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup dependencies
        run: npm ci

      - name: Compile Java inputs with Gradle
        run: |
          ./gradlew \
            :game:jar \
            :platform:jar \
            :platform-teavm:jar \
            :teavm-compat:jar \
            -Dorg.gradle.jvmargs='-Xmx8g -Xss8m -XX:MaxMetaspaceSize=1g -XX:+UseG1GC' \
            --console=plain \
            --no-daemon \
            --max-workers=2

      - name: Build standalone WebXR JavaScript
        run: npm run build:xrjs

      - name: Build standalone HTML
        env:
          # Standalone TeaVM uses a separate capped JVM for whole-program linking.
          EAGLER_BUILD_CAP_MIB: '13312'
          EAGLER_LINK_HEAP_MIB: '12288'
        run: |
          node wasm-toolchain/build-single-html.js \
            --fast-package \
            --output eaglercraft-26.2-single.html

      - name: Verify HTML artifact
        shell: bash
        run: |
          test -s eaglercraft-26.2-single.html
          test -s eaglerxr-companion.html
          sha256sum eaglercraft-26.2-single.html > eaglercraft-26.2-single.html.sha256

      - name: Upload built HTML
        uses: actions/upload-artifact@v4
        with:
          name: eaglerxr-html
          if-no-files-found: error
          path: |
            eaglercraft-26.2-single.html
            eaglercraft-26.2-single.html.sha256
            eaglerxr-companion.html
            xrjs/eaglerxr-webxr.js
